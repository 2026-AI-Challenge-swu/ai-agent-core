[project]
name = "ai-agent-core"
version = "0.1.0"
description = "Agent 실행, Planning, Tool Calling, Memory 관리 및 최종 답변 생성"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    # --- Web Framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # --- Agent Orchestration ---
    "langgraph>=0.2.50",
    "langchain>=0.3.7",
    "langchain-community>=0.4.2",
    "langchain-core>=0.3.15",
    "langchain-huggingface",
    "langchain-classic",
    # --- ai-tool-server / ai-rag-engine 호출용 (HTTP only) ---
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    # --- Memory: Postgres 기반 LangGraph checkpointer ---
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.2.0",
    # --- 사내 공통 라이브러리 ---
    "ai-common",
    # --- Observability ---
    "structlog>=24.4.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "respx>=0.22.0",           # 외부 HTTP mocking
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[tool.uv.sources]
ai-common = { path = "../ai-common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_agent_core"]

# --- Ruff ---
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ai_agent_core", "ai_common"]

# --- Mypy ---
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

# --- Pytest ---
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src/ai_agent_core --cov-report=term-missing"
